###
#  KITTY CONFIGURATION FILE 4 of 4
#  https://github.com/snes19xx
####

# --- Typography ---
font_family      CMU Typewriter Text Variable Width
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.5

# --- Window Layout & Padding ---
placement_strategy top-left
window_padding_width 0 12 12 12
hide_window_decorations yes
confirm_os_window_close 0

# --- Cursor ---
cursor_shape underline
cursor_underline_thickness 2.0
cursor_blink_interval 0

# --- Tab Bar ---
tab_bar_edge top
tab_bar_style separator
tab_separator " │ "
tab_bar_min_tabs 1
tab_bar_show_new_tab_button yes
tab_bar_align right
tab_bar_margin_height 0.0 0.0

# Minimal template with a close indicator
tab_title_template " {index}: {title}"

# Mouse mappings for easy closing
mouse_map middle click grabbed,ungrabbed close_tab
mouse_map right click grabbed,ungrabbed close_tab

# --- Active/Inactive Tab Colors ---
active_tab_foreground   #141719
active_tab_background   #7aa265
active_tab_font_style   bold
inactive_tab_foreground #F0ECE6
inactive_tab_background #3c474d
inactive_tab_font_style normal
tab_bar_background      #141719

# --- Color Scheme (Everforest Dark) ---
background  #141719
foreground  #F0ECE6

cursor                #F0ECE6

selection_foreground  #d4e2c5
selection_background  #3a4438

color0  #3c474d
color8  #868d80

# red
color1                #a04f50
color9                #a04f50

# green
color2                #7aa265
color10               #729e5a

# yellow
color3                #d9bb80
color11               #d9bb80

# blue
color4                #83b6af
color12               #83b6af

# magenta
color5                #d39bb6
color13               #d39bb6

# cyan
color6                #87c095
color14               #87c095

# light gray / dark gray
color7                #868d80
color15               #868d80

# --- Performance & System (Wayland Optimization) ---
linux_display_server wayland
repaint_delay 8
input_delay 2
sync_to_monitor yes