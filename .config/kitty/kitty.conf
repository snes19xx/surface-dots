###
#  KITTY CONFIGURATION FILE 1 of 4
#  https://github.com/snes19xx
####

confirm_os_window_close 0

include ~/.local/state/theme/kitty_theme.conf

detect_urls yes
url_color #2d65b8
url_style curly

scrollback_lines 1500
wheel_scroll_multiplier 10.0

background_opacity 1
hide_window_decorations yes

input_delay 0

enable_audio_bell no

map ctrl+shift+f send_text all clear\n cd `cdinteractive`\n
