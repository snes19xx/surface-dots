# Greeting
label {
    monitor =
    text = Welcome back, <span font_family="Newsreader" style="italic" foreground="##87b08a">snes</span>.
    color = rgba(200, 193, 178, 1)   # inkSoft
    font_family = EB Garamond
    font_size = 19

    position = 0, 150
    halign = center
    valign = bottom
    zindex = 2
}

# Input field
input-field {
    monitor =
    size = 240, 42
    outline_thickness = 1
    dots_size = 0.18
    dots_spacing = 0.4
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(135, 176, 138, 0.35)  
    inner_color = rgba(255, 255, 255, 0.04)
    font_color = rgba(236, 230, 214, 1)     
    check_color = rgba(135, 176, 138, 1)   
    fail_color = rgba(217, 144, 137, 1)    

    font_family = Newsreader
    placeholder_text = <i><span foreground="##5a5648">passphrase</span></i>
    fail_text = <i><span foreground="##d99089">$FAIL</span></i>
    hide_input = false
    rounding = 8

    fade_on_empty = false

    position = 0, 84
    halign = center
    valign = bottom
    zindex = 2
}

label {
    monitor =
    text = <span letter_spacing="1600">ENTER PASSPHRASE TO UNLOCK</span>
    color = rgba(90, 86, 72, 1)     
    font_family = JetBrains Mono
    font_size = 9

    position = 0, 52
    halign = center
    valign = bottom
    zindex = 2
}

# -----------------------------------------------------
# FOOTER  -- Local moonphase(scripts/lock-moon.sh)
# -----------------------------------------------------
label {
    monitor =
    text = cmd[update:1800000] ~/.config/hypr/scripts/lock-moon.sh
    color = rgba(200, 193, 178, 1)
    font_family = CMU Typewriter Text Variable Width
    font_size = 19

    position = 48, 40
    halign = left
    valign = bottom

    shadow_passes = 0
}

# -----------------------------------------------------
# WEATHER (top-left)
# -----------------------------------------------------
label {
    monitor =
    text = cmd[update:300000] ~/.config/hypr/scripts/lock-weather.sh
    color = rgba(200, 193, 178, 1) 
    font_family = Newsreader
    font_size = 16

    position = 44, -40
    halign = left
    valign = top

    shadow_passes = 0
}

# -----------------------------------------------------
# STATUS (top-right)
# -----------------------------------------------------
label {
    monitor =
    text = cmd[update:30000] echo "<span letter_spacing='1200'>$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo '--')%  <span font_family='JetBrainsMono Nerd Font'>󱊣</span></span>"
    color = rgba(135, 176, 138, 1)   
    font_family = CMU Typewriter Text Variable Width
    font_size = 13

    position = -44, -40
    halign = right
    valign = top

    shadow_passes = 0
}
