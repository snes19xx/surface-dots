## -----------------------------------------------------
#  Hyprlock -- ported from my SDDM theme "stellarium" 
#  by @snes19xx, https://github.com/snes19xx
## -----------------------------------------------------

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
    hide_cursor = true
}

# -----------------------------------------------------
# BACKGROUND
# -----------------------------------------------------
background {
    monitor =
    path = /home/snes/.config/hypr/background.jpg
    contrast = 0.95
    brightness = 0.85
    zindex = -2
}

shape {
    monitor =
    size = 100%, 100%
    color = rgba(7, 9, 11, 0.55)
    zindex = -1
}

# -----------------------------------------------------
# CLOCK  HH : MM  -- styled via scripts/lock-clock.sh
# -----------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/lock-clock.sh
    font_family = EB Garamond
    font_size = 150

    position = 0, 330
    halign = center
    valign = center

    shadow_passes = 0
}

# DATE 
label {
    monitor =
    text = cmd[update:30000] echo "<i>$(date +'%A, %-d %B %Y')</i>"
    color = rgba(200, 193, 178, 1)  
    font_family = Newsreader
    font_size = 26

    position = 0, 200
    halign = center
    valign = center

    shadow_passes = 0
}

