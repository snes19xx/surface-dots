<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --text-main: #e6e6e6;
        --text-hover: #ffffff;
        --shadow: rgba(0, 0, 0, 0.2);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "JetBrains Mono", monospace;
        color: var(--text-main);
        height: 100vh;
        overflow: hidden;
        background-color: #1d1d1d;
        -webkit-font-smoothing: antialiased;
      }

      /* Background Iframe */
      #bg-site {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        z-index: 0;
      }

      /* UI Overlay */
      #ui-layer {
        position: fixed;
        inset: 0;
        z-index: 1;
        /* Lets clicks pass through the empty space to the background */
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      /* Make actual UI elements clickable */
      #ui-layer > * {
        pointer-events: auto;
      }

      h1 {
        position: fixed;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        font-weight: 500;
        font-size: clamp(24px, 3vw, 32px);
        letter-spacing: 0.5px;
        white-space: nowrap;
        text-shadow:
          0 2px 6px var(--shadow),
          0 0 10px rgba(0, 0, 0, 0.5);
      }

      /* Side Links Layout */
      .side-links {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .side-links.left {
        left: 40px;
        align-items: flex-start;
      }

      .side-links.right {
        right: 40px;
        align-items: flex-end;
      }

      .link {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--text-main);
        text-decoration: none;
        font-size: 20px;
        font-weight: 500;
        text-shadow: 0 2px 5px var(--shadow);
        transition:
          transform 0.15s ease,
          color 0.15s ease;
        will-change: transform;
      }

      .side-links.right .link {
        flex-direction: row-reverse;
      }

      .link:hover {
        color: var(--text-hover);
        transform: translateY(-2px) scale(1.05);
        text-shadow: 0 4px 8px var(--shadow);
      }

      .icon {
        width: 24px;
        height: 24px;
        stroke: currentColor;
        stroke-width: 2;
        filter: drop-shadow(0 2px 3px var(--shadow));
      }

      .weather {
        position: fixed;
        bottom: 36px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 22px;
        font-weight: 400;
        text-shadow: 0 2px 5px var(--shadow);
      }

      .weather svg {
        width: 28px;
        height: 28px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 2px 3px var(--shadow));
      }

      /* Interact Buttons */
      .toggle-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 10;
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        padding: 8px 14px;
        cursor: pointer;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        backdrop-filter: blur(4px);
        transition:
          background 0.2s,
          display 0s;
      }

      .toggle-btn:hover {
        background: rgba(0, 0, 0, 0.9);
      }

      #btn-exit {
        display: none;
        background: rgba(255, 255, 255, 0.85);
        color: #000;
        border-color: rgba(0, 0, 0, 0.2);
      }

      #btn-exit:hover {
        background: rgba(255, 255, 255, 1);
      }

      /* Interactive State */
      body.is-interacting #ui-layer {
        opacity: 0;
        pointer-events: none;
      }
      body.is-interacting #ui-layer > * {
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <iframe
      id="bg-site"
      src="https://thorium.rocks/media/singing_particles/singing-particles.html"
      title="Particles Background"
    ></iframe>

    <button
      id="btn-interact"
      class="toggle-btn"
      title="Interact with background (`)"
    >
      Interact
    </button>
    <button id="btn-exit" class="toggle-btn" title="Exit (Esc)">Exit</button>

    <div id="ui-layer">
      <h1 id="welcome">Loading...</h1>

      <nav class="side-links left">
        <a href="https://q.utoronto.ca/" class="link">
          <svg class="icon" viewBox="0 0 24 24" fill="none">
            <path d="M12 3l9 4.5-9 4.5-9-4.5z" />
            <path d="M5 9v6c0 3 7 3 7 3s7 0 7-3V9" />
            <path d="M19 10v4" />
            <circle cx="19" cy="15" r="1" />
          </svg>
          <span>Quercus</span>
        </a>
        <a href="https://acorn.utoronto.ca/" class="link">
          <svg class="icon" viewBox="0 0 24 24" fill="none">
            <path
              d="M12 2c-2.5 0-4.5 1.5-5.5 3.5S4 10 4 12c0 3 2.5 5 5 5h6c2.5 0 5-2 5-5 0-2-1.5-4.5-2.5-6.5S14.5 2 12 2z"
            />
            <path d="M12 17v5" />
            <path d="M9 22h6" />
          </svg>
          <span>Acorn</span>
        </a>
      </nav>

      <nav class="side-links right">
        <a href="https://youtube.com" class="link">
          <svg class="icon" viewBox="0 0 24 24" fill="none">
            <path
              d="M21.8 8s-.2-1.4-.8-2c-.7-.8-1.5-.8-1.9-.9C16.5 5 12 5 12 5h0s-4.5 0-7.1.2c-.4 0-1.2.1-1.9.9-.6.6-.8 2-.8 2S2 9.6 2 11.2v1.6c0 1.6.2 3.2.2 3.2s.2 1.4.8 2c.7.8 1.6.8 2 .9 1.5.1 7 .2 7 .2s4.5 0 7.1-.2c.4 0 1.2-.1 1.9-.9.6-.6.8-2 .8-2s.2-1.6.2-3.2v-1.6c0-1.6-.2-3.2-.2-3.2z"
            />
            <path d="M10 15l5-3-5-3v6z" />
          </svg>
          <span>YouTube</span>
        </a>
        <a href="https://wiki.archlinux.org/" class="link">
          <svg class="icon" viewBox="0 0 24 24" fill="none">
            <path d="M8 9l3 3-3 3M13 17h4" />
            <rect x="3" y="4" width="18" height="16" rx="2" ry="2" />
          </svg>
          <span>Archwiki</span>
        </a>
      </nav>

      <div class="weather" id="weather">
        <span id="wx-icon"></span>
        <span id="wx-temp">--°C</span>
      </div>
    </div>

    <script>
      const btnInteract = document.getElementById("btn-interact");
      const btnExit = document.getElementById("btn-exit");

      function enterInteractMode() {
        document.body.classList.add("is-interacting");
        btnInteract.style.display = "none";
        btnExit.style.display = "inline-block";
      }

      function exitInteractMode() {
        document.body.classList.remove("is-interacting");
        btnExit.style.display = "none";
        btnInteract.style.display = "inline-block";
      }

      btnInteract.addEventListener("click", enterInteractMode);
      btnExit.addEventListener("click", exitInteractMode);

      document.addEventListener("keydown", (e) => {
        if (e.key === "`") {
          document.body.classList.contains("is-interacting")
            ? exitInteractMode()
            : enterInteractMode();
        }
        if (e.key === "Escape") {
          exitInteractMode();
        }
      });

      // --- Greeting ---
      function updateGreeting() {
        const date = new Date();
        const hour = date.getHours();
        const day = date.getDay();
        const welcomeEl = document.getElementById("welcome");

        if (day === 5 && hour >= 16) {
          welcomeEl.textContent = "Happy Friday, snes.";
          return;
        }

        welcomeEl.textContent = "Welcome back to Firefox, snes!";
      }
      updateGreeting();
      setInterval(updateGreeting, 60000);

      // --- Weather ---
      const wxIcons = {
        sun: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`,
        moon: `<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`,
        cloud: `<svg viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>`,
        rain: `<svg viewBox="0 0 24 24"><line x1="16" y1="13" x2="16" y2="21"/><line x1="8" y1="13" x2="8" y2="21"/><line x1="12" y1="15" x2="12" y2="23"/><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg>`,
        snow: `<svg viewBox="0 0 24 24"><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/><path d="m20 16-4-4 4-4"/><path d="m4 8 4 4-4 4"/><path d="m16 4-4 4-4-4"/><path d="m8 20 4-4 4 4"/></svg>`,
        thunder: `<svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`,
      };

      function getIcon(code, isDay) {
        if (code === 0) return isDay ? wxIcons.sun : wxIcons.moon;
        if (code >= 1 && code <= 3) return wxIcons.cloud;
        if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82))
          return wxIcons.rain;
        if (code >= 71 && code <= 86) return wxIcons.snow;
        if (code >= 95) return wxIcons.thunder;
        return wxIcons.cloud;
      }

      async function loadWeather() {
        try {
          const res = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=43.654&longitude=-79.383&current=temperature_2m,weather_code,is_day&timezone=auto`,
          );
          const data = await res.json();

          const temp = Math.round(data.current.temperature_2m);
          const code = data.current.weather_code;
          const isDay = data.current.is_day === 1;

          document.getElementById("wx-temp").textContent = `${temp}°C`;
          document.getElementById("wx-icon").innerHTML = getIcon(code, isDay);
        } catch (e) {
          document.getElementById("wx-temp").textContent = "Offline";
          document.getElementById("wx-icon").innerHTML = wxIcons.cloud;
        }
      }
      loadWeather();
    </script>
  </body>
</html>
